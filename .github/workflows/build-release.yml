name: Build & Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Pinned llama.cpp Source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 278a89cb787c1d2b4cff9748b1df9cfd2aa69976
          path: third_party/llama.cpp
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK 28.2 & CMake 3.22.1
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: versioning
        run: |
          VERSION="1.1.${{ github.run_number }}"
          TAG_NAME="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Building version $VERSION (Tag: $TAG_NAME)"

      - name: Run Unit Tests, Lint & Build APK
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

      - name: Rename Output APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/OpenScreenTranslator-${{ env.TAG_NAME }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenTranslator-${{ env.TAG_NAME }}
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Open Screen Translator ${{ env.TAG_NAME }}"
          body: |
            ### 🚀 Automated Build & Release (${{ env.TAG_NAME }})

            - **Version**: `${{ env.VERSION }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            #### ✨ Có gì mới:
            - **Hy-MT2-1.8B Offline AI (`llama.cpp` JNI)**: Dịch offline chất lượng cao hơn cho hội thoại/truyện tranh với trình tải GGUF trực tiếp từ Hugging Face (`UD-IQ2_M`, `Q3_K_S`, `Q4_K_M`)
            - **Chế độ Đọc Truyện Tranh (Comic Mode)**: Tự nối dòng vỡ/gạch nối, gom cụm bong bóng thoại, hỗ trợ chiều đọc **Manga R→L** & **Webtoon L→R**, dịch ngữ cảnh cả trang trên Hy-MT2 & Gemini
            - **Giao diện mới Celestial Star Atlas**: Material 3 hỗ trợ đầy đủ 2 chế độ **Ban ngày / Ban đêm**, bảng mô phỏng tương tác và bộ icon Adaptive + Monochrome mới
            - Hỗ trợ đầy đủ Google ML Kit Offline, Gemini AI & Google Translate Cloud

            📥 **Tải file APK cài đặt bên dưới:**
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
