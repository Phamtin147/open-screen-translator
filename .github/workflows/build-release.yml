name: Build & Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Version
        id: versioning
        run: |
          VERSION="1.0.${{ github.run_number }}"
          TAG_NAME="v$VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Building version $VERSION (Tag: $TAG_NAME)"

      - name: Build APK with Gradle
        run: |
          ./gradlew assembleDebug

      - name: Rename Output APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/OpenScreenTranslator-${{ env.TAG_NAME }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenTranslator-${{ env.TAG_NAME }}
          path: release-artifacts/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Open Screen Translator ${{ env.TAG_NAME }}"
          body: |
            ### 🚀 Automated Build & Release (${{ env.TAG_NAME }})

            - **Version**: `${{ env.VERSION }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            #### ✨ Tính năng:
            - 100% Mã nguồn mở, 0% Quảng cáo, Không giới hạn lượt dịch
            - Nhận diện chữ Offline bằng Google ML Kit OCR
            - Dịch On-Device hoặc Free Cloud không cần API Key
            - Bong bóng nổi đa năng kéo thả trên màn hình

            📥 **Tải file APK cài đặt bên dưới:**
          files: release-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
