<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Graphite Hairline Console</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    font-family: system-ui, -apple-system, Roboto, sans-serif;
    background: #141518; color: #F1F5F9;
    display: flex; flex-direction: column; padding: 20px 16px; gap: 12px;
  }
  .bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #2B2E36; }
  h1 { font-size: 18px; font-weight: 700; }
  .badge { font-size: 11px; padding: 4px 8px; border: 1px solid #38BDF8; color: #38BDF8; border-radius: 6px; font-variant-numeric: tabular-nums; }
  .panel { background: #1E2025; border: 1px solid #2B2E36; border-radius: 12px; padding: 14px; }
  .btn { width: 100%; height: 48px; border-radius: 10px; border: 0; background: #38BDF8; color: #0B1117; font-size: 14px; font-weight: 700; margin-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .box { background: #141518; border: 1px solid #2B2E36; border-radius: 8px; padding: 10px; }
  .k { font-size: 11px; color: #94A3B8; }
  .v { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2B2E36; }
  .row:last-child { border-bottom: 0; padding-bottom: 0; }
  .danger-zone { margin-top: auto; border: 1px solid #5B2429; background: #1C1416; border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
  .btn-del { padding: 8px 12px; border-radius: 8px; border: 1px solid #EF4444; background: transparent; color: #FCA5A5; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
  <div class="bar">
    <h1>Open Screen Translator</h1>
    <span class="badge">OFFLINE READY</span>
  </div>
  <div class="panel">
    <div style="display:flex;justify-content:space-between">
      <span style="font-size:15px;font-weight:700">Dịch màn hình nổi</span>
      <span style="font-size:12px;color:#94A3B8">Chưa chạy</span>
    </div>
    <button class="btn">Khởi chạy bong bóng dịch</button>
  </div>
  <div class="grid2">
    <div class="box"><div class="k">Nguồn</div><div class="v">Nhật (ja)</div></div>
    <div class="box"><div class="k">Đích</div><div class="v">Việt (vi)</div></div>
  </div>
  <div class="panel">
    <div class="row"><div><div style="font-size:13px;font-weight:600">Hy-MT2-1.8B GGUF</div><div class="k">UD-IQ2_M · 689 MB</div></div><span class="badge">Active</span></div>
    <div class="row"><div><div style="font-size:13px;font-weight:600">Thứ tự đọc truyện</div><div class="k">Manga phải → trái, gom dòng</div></div><span class="k">R → L</span></div>
    <div class="row"><div><div style="font-size:13px;font-weight:600">Thẻ dịch phủ màn hình</div><div class="k">Độ mờ 90% · Chữ 14sp</div></div><span class="k">Tùy biến</span></div>
  </div>
  <div class="danger-zone">
    <div><div style="font-size:13px;font-weight:600;color:#FECACA">Bộ nhớ Model Offline</div><div class="k">689.2 MB đã lưu</div></div>
    <button class="btn-del">Xóa model</button>
  </div>
</body>
</html>
