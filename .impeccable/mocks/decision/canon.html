<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Material 3 Standard Utility</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 390px; height: 844px; overflow: hidden;
    font-family: system-ui, -apple-system, Roboto, sans-serif;
    background: #FDFBFF; color: #1C1B1F;
    display: flex; flex-direction: column; padding: 20px 16px; gap: 14px;
  }
  h1 { font-size: 22px; font-weight: 700; }
  .card { background: #F3EFF7; border-radius: 16px; padding: 16px; }
  .btn { width: 100%; height: 48px; border-radius: 24px; border: 0; background: #6750A4; color: #FFF; font-size: 14px; font-weight: 600; margin-top: 12px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #E6E0E9; font-size: 14px; }
</style>
</head>
<body>
  <h1>Open Screen Translator</h1>
  <div class="card">
    <div style="font-size:15px;font-weight:600">Trạng thái: Chưa bật</div>
    <button class="btn">Bật dịch màn hình</button>
  </div>
  <div class="card">
    <div class="row"><span>Ngôn ngữ gốc</span><strong>Tiếng Nhật</strong></div>
    <div class="row"><span>Ngôn ngữ đích</span><strong>Tiếng Việt</strong></div>
    <div class="row" style="border:0"><span>Engine</span><strong>Hy-MT2 Offline</strong></div>
  </div>
  <div class="card">
    <div class="row"><span>Chế độ truyện</span><strong>Manga (R→L)</strong></div>
    <div class="row" style="border:0"><span>Độ mờ thẻ</span><strong>90%</strong></div>
  </div>
</body>
</html>
